# 开发依赖图：日常开发与全部测试 scheme 使用。仅有 Debug 配置。
# 出包、Release 验证只能经 scripts/build.py --mode release 使用 project-release.yml。
include: [project-base.yml]
name: Walk
configs:
  Debug: debug

packages:
  WalkDebugTools:
    path: Packages/WalkDebugTools

targets:
  Walk:
    dependencies:
      - package: WalkDebugTools
    settings:
      configs:
        Debug:
          WALK_API_BASE_URL: https://api.example.invalid/walkbg/api/v1
          WALK_DATA_MODE: mock
          WALK_ENVIRONMENT: development

  WalkTests:
    dependencies:
      - package: WalkDebugTools

  WalkDebugToolsUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests/DebugToolsUITests
    dependencies:
      - target: Walk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.walk.app.debug-tools-ui-tests
        TEST_TARGET_NAME: Walk
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Walk:
    build:
      targets:
        Walk: all
        WalkTests: [test]
    run:
      # 不注入环境变量：环境变量优先于已保存的 Debug 设置（R-CONFIG），
      # 注入会使 Debug 页的选择失效。默认值来自 Debug 构建配置。
      config: Debug
    test:
      config: Debug
      environmentVariables:
        WALK_API_BASE_URL: "https://api.example.invalid/walkbg/api/v1"
        WALK_DATA_MODE: mock
        WALK_ENVIRONMENT: test
      targets:
        - WalkTests
    profile:
      config: Debug
    analyze:
      config: Debug
    archive:
      # 开发图没有 Release 配置；出包只走 scripts/build.py --mode release。
      config: Debug

  WalkBaseline:
    build:
      targets:
        Walk: all
        WalkBaselineTests: [test]
        WalkBaselineUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WalkBaselineTests
        - WalkBaselineUITests
    profile:
      config: Debug
    analyze:
      config: Debug
    archive:
      config: Debug

  WalkComponents:
    build:
      targets:
        Walk: all
        WalkComponentTests: [test]
        WalkComponentUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WalkComponentTests
        - WalkComponentUITests
    profile:
      config: Debug
    analyze:
      config: Debug
    archive:
      config: Debug

  WalkDebugTools:
    build:
      targets:
        Walk: all
        WalkDebugToolsUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WalkDebugToolsUITests
    profile:
      config: Debug
    analyze:
      config: Debug
    archive:
      config: Debug
