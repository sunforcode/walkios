# 开发依赖图：日常开发与全部测试 scheme 使用。仅有 Debug 配置。
# 出包、Release 验证只能经 scripts/build.py --mode release 使用 project-release.yml。
include: [project-base.yml]
name: Walk
configs:
  Debug: debug

packages:
  WalkDebugTools:
    path: Packages/WalkDebugTools

targets:
  Walk:
    dependencies:
      - package: WalkDebugTools
    settings:
      configs:
        Debug:
          # 默认模式为 mock（不发请求）；服务器仍指向真实后端，使调试面板切到 real / remoteOnly 时
          # 有可用地址。真实网络模式拒绝占位地址（R-CONFIG），占位地址会导致启动失败。
          WALK_API_BASE_URL: https://vialu.cn/walkbg/api/v1
          WALK_DATA_MODE: mock
          WALK_ENVIRONMENT: development

  WalkTests:
    dependencies:
      - package: WalkDebugTools

  WalkDebugToolsUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests/DebugToolsUITests
    dependencies:
      - target: Walk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.walk.app.debug-tools-ui-tests
        TEST_TARGET_NAME: Walk
        GENERATE_INFOPLIST_FILE: YES

  WalkDataModeE2EUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests/DataModeE2EUITests
    dependencies:
      - target: Walk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.walk.app.data-mode-e2e-ui-tests
        TEST_TARGET_NAME: Walk
        GENERATE_INFOPLIST_FILE: YES

  WalkKeyFlowUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests/KeyFlowUITests
    dependencies:
      - target: Walk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.walk.app.key-flow-ui-tests
        TEST_TARGET_NAME: Walk
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Walk:
    build:
      targets:
        Walk: all
        WalkTests: [test]
    run:
      # 不注入环境变量：环境变量优先于已保存的 Debug 设置（R-CONFIG），
      # 注入会使 Debug 页的选择失效。默认值来自 Debug 构建配置。
      config: Debug
    test:
      config: Debug
      environmentVariables:
        WALK_API_BASE_URL: "https://api.example.invalid/walkbg/api/v1"
        WALK_DATA_MODE: mock
        WALK_ENVIRONMENT: test
      targets:
        - WalkTests
    profile:
      config: Debug
    analyze:
      config: Debug
    archive:
      # 开发图没有 Release 配置；出包只走 scripts/build.py --mode release。
      config: Debug

  WalkComponents:
    build:
      targets:
        Walk: all
        WalkComponentTests: [test]
        WalkComponentUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WalkComponentTests
        - WalkComponentUITests
    profile:
      config: Debug
    analyze:
      config: Debug
    archive:
      config: Debug

  WalkDebugTools:
    build:
      targets:
        Walk: all
        WalkDebugToolsUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WalkDebugToolsUITests
    profile:
      config: Debug
    analyze:
      config: Debug
    archive:
      config: Debug

  WalkDataModeE2E:
    build:
      targets:
        Walk: all
        WalkDataModeE2EUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WalkDataModeE2EUITests
    profile:
      config: Debug
    analyze:
      config: Debug
    archive:
      config: Debug

  WalkKeyFlows:
    build:
      targets:
        Walk: all
        WalkKeyFlowUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WalkKeyFlowUITests
    profile:
      config: Debug
    analyze:
      config: Debug
    archive:
      config: Debug
