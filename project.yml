name: Walk
options:
  bundleIdPrefix: com.walk
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"

packages:
  Alamofire:
    url: https://github.com/Alamofire/Alamofire.git
    exactVersion: 5.9.1

targets:
  Walk:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Walk
        excludes:
          - "Tests/**/*"
    dependencies:
      - package: Alamofire
    info:
      path: Walk/Resources/Info.plist
      properties:
        CFBundleDisplayName: Walk
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        WalkAPIBaseURL: "$(WALK_API_BASE_URL)"
        WalkDataSourceMode: "$(WALK_DATA_SOURCE_MODE)"
        WalkEnvironment: "$(WALK_ENVIRONMENT)"
        NSLocationWhenInUseUsageDescription: 需要使用您的位置来记录轨迹和显示当前位置
        NSLocationAlwaysAndWhenInUseUsageDescription: 需要在后台持续获取位置以记录轨迹
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.walk.app
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        WALK_API_BASE_URL: https://api.example.invalid/walkbg/api/v1
        WALK_DATA_SOURCE_MODE: mock
        WALK_ENVIRONMENT: production

  WalkTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Walk/Tests
      - path: Walk/Resources/MockAPI/route-detail-route-1.json
        buildPhase: resources
    dependencies:
      - target: Walk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.walk.app.tests
        TEST_TARGET_NAME: Walk
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Walk:
    build:
      targets:
        Walk: all
        WalkTests: [test]
    run:
      config: Debug
      environmentVariables:
        WALK_API_BASE_URL: "https://api.example.invalid/walkbg/api/v1"
        WALK_DATA_SOURCE_MODE: mock
    test:
      config: Debug
      environmentVariables:
        WALK_API_BASE_URL: "https://api.example.invalid/walkbg/api/v1"
        WALK_DATA_SOURCE_MODE: mock
      targets:
        - WalkTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
