name: Walk
options:
  bundleIdPrefix: com.walk
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: A6524QBUHH
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "iPhone Developer"
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"

packages:
  Lottie:
    url: https://github.com/airbnb/lottie-ios.git
    exactVersion: 4.4.3
  Alamofire:
    url: https://github.com/Alamofire/Alamofire.git
    exactVersion: 5.9.1
  WalkData:
    path: Packages/WalkData
  WalkDesignSystem:
    path: Packages/WalkDesignSystem

targets:
  Walk:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Walk
        excludes:
          - "Tests/**/*"
    dependencies:
      - package: Alamofire
      - package: Lottie
      - package: WalkData
      - package: WalkDesignSystem
    info:
      path: Walk/Resources/Info.plist
      properties:
        CFBundleDisplayName: Walk
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchImage
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        WalkAPIBaseURL: "$(WALK_API_BASE_URL)"
        WalkDataMode: "$(WALK_DATA_MODE)"
        WalkEnvironment: "$(WALK_ENVIRONMENT)"
        NSLocationWhenInUseUsageDescription: 需要使用您的位置来记录轨迹和显示当前位置
        NSLocationAlwaysAndWhenInUseUsageDescription: 需要在后台持续获取位置以记录轨迹
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.walk.app
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
      configs:
        Debug:
          WALK_API_BASE_URL: https://api.example.invalid/walkbg/api/v1
          WALK_DATA_MODE: mock
          WALK_ENVIRONMENT: development
        Release:
          WALK_API_BASE_URL: https://vialu.cn/walkbg/api/v1
          WALK_DATA_MODE: real
          WALK_ENVIRONMENT: production

  WalkTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Walk/Tests
      - path: Walk/Resources/MockAPI/route-detail-route-1.json
        buildPhase: resources
    dependencies:
      - package: Alamofire
      - target: Walk
      - package: WalkData
      - package: WalkDesignSystem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.walk.app.tests
        TEST_TARGET_NAME: Walk
        GENERATE_INFOPLIST_FILE: YES

  WalkBaselineUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests/BaselineUITests
    dependencies:
      - target: Walk
      - package: WalkData
      - package: WalkDesignSystem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.walk.app.baseline-ui-tests
        TEST_TARGET_NAME: Walk
        GENERATE_INFOPLIST_FILE: YES

  WalkBaselineTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests/BaselineTests
    dependencies:
      - target: Walk
      - package: WalkData
      - package: WalkDesignSystem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.walk.app.baseline-tests
        TEST_TARGET_NAME: Walk
        GENERATE_INFOPLIST_FILE: YES

  WalkComponentTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests/ComponentTests
    dependencies:
      - target: Walk
      - package: WalkData
      - package: WalkDesignSystem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.walk.app.component-tests
        TEST_TARGET_NAME: Walk
        GENERATE_INFOPLIST_FILE: YES

  WalkComponentUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests/ComponentUITests
    dependencies:
      - target: Walk
      - package: WalkData
      - package: WalkDesignSystem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.walk.app.component-ui-tests
        TEST_TARGET_NAME: Walk
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Walk:
    build:
      targets:
        Walk: all
        WalkTests: [test]
    run:
      # 不注入环境变量：环境变量优先于已保存的 Debug 设置（R-CONFIG），
      # 注入会使 Debug 页的选择失效。默认值来自 Debug 构建配置。
      config: Debug
    test:
      config: Debug
      environmentVariables:
        WALK_API_BASE_URL: "https://api.example.invalid/walkbg/api/v1"
        WALK_DATA_MODE: mock
        WALK_ENVIRONMENT: test
      targets:
        - WalkTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  WalkBaseline:
    build:
      targets:
        Walk: all
        WalkBaselineTests: [test]
        WalkBaselineUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WalkBaselineTests
        - WalkBaselineUITests

  WalkComponents:
    build:
      targets:
        Walk: all
        WalkComponentTests: [test]
        WalkComponentUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WalkComponentTests
        - WalkComponentUITests
