# Walk 工程共用模板。不直接生成工程：
#   project.yml          开发依赖图（仅 Debug 配置，含 WalkDebugTools → DebugSwift），生成仓内 Walk.xcodeproj
#   project-release.yml  生产依赖图（仅 Release 配置，不声明调试依赖），只经 scripts/build.py 生成到 build/
# 依据 specs/README.md R-DEBUG：Release 的依赖图、编译输入、链接与产物不得包含 DebugSwift。
options:
  bundleIdPrefix: com.walk
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: A6524QBUHH
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "iPhone Developer"
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"

packages:
  Lottie:
    url: https://github.com/airbnb/lottie-ios.git
    exactVersion: 4.4.3
  Alamofire:
    url: https://github.com/Alamofire/Alamofire.git
    exactVersion: 5.9.1
  WalkData:
    path: Packages/WalkData
  WalkDesignSystem:
    path: Packages/WalkDesignSystem
  MapComponentCore:
    path: Packages/MapComponentCore
  OutdoorMap:
    path: Packages/OutdoorMap

targets:
  Walk:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Walk
        excludes:
          - "Tests/**/*"
    dependencies:
      - package: Alamofire
      - package: Lottie
      - package: WalkData
      - package: WalkDesignSystem
      - package: MapComponentCore
      - package: OutdoorMap
    info:
      path: Walk/Resources/Info.plist
      properties:
        CFBundleDisplayName: "$(WALK_DISPLAY_NAME)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WalkDistribution: "$(WALK_DISTRIBUTION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchImage
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        WalkAPIBaseURL: "$(WALK_API_BASE_URL)"
        WalkDataMode: "$(WALK_DATA_MODE)"
        WalkEnvironment: "$(WALK_ENVIRONMENT)"
        MBXAccessToken: "$(MAPBOX_ACCESS_TOKEN)"
        NSLocationWhenInUseUsageDescription: 需要使用您的位置来记录轨迹和显示当前位置
        NSLocationAlwaysAndWhenInUseUsageDescription: 需要在后台持续获取位置以记录轨迹
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sunyongji.walk
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "28"
        WALK_DISPLAY_NAME: Walk
        WALK_DISTRIBUTION: production
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES

  WalkTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Walk/Tests
      - path: Walk/Resources/MockAPI/route-detail-route-1.json
        buildPhase: resources
    dependencies:
      - package: Alamofire
      - target: Walk
      - package: WalkData
      - package: WalkDesignSystem
      - package: MapComponentCore
      - package: OutdoorMap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.walk.app.tests
        TEST_TARGET_NAME: Walk
        GENERATE_INFOPLIST_FILE: YES

  WalkComponentTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests/ComponentTests
    dependencies:
      - target: Walk
      - package: WalkData
      - package: WalkDesignSystem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.walk.app.component-tests
        TEST_TARGET_NAME: Walk
        GENERATE_INFOPLIST_FILE: YES

  WalkComponentUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests/ComponentUITests
    dependencies:
      - target: Walk
      - package: WalkData
      - package: WalkDesignSystem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.walk.app.component-ui-tests
        TEST_TARGET_NAME: Walk
        GENERATE_INFOPLIST_FILE: YES
